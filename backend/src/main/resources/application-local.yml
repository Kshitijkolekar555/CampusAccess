# ============================================================
# application-local.yml — Local developer machine profile
# Run with: -Dspring.profiles.active=local
# Secrets may be in .env or hardcoded for dev convenience ONLY.
# NEVER commit real credentials.
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/acampusaccessdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Purva@2118_
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000
      pool-name: PictGateSecurityPool
      register-mbeans: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.pict.gatesecurity: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-at-least-256-bits-long-pad-if-needed}
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:8081

face:
  service:
    url: ${FACE_SERVICE_URL:http://localhost:8001}
