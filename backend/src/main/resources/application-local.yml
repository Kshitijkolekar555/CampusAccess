# ============================================================
# application-local.yml — Local developer machine profile
# Run with: -Dspring.profiles.active=local
# Secrets may be in .env or hardcoded for dev convenience ONLY.
# NEVER commit real credentials.
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DB:acampusaccessdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: none        # Flyway owns the schema; Hibernate just maps to it
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    root: INFO
    com.pict.gatesecurity: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-at-least-256-bits-long-pad-if-needed}
  cors:
    allowed-origins: http://localhost:5173
