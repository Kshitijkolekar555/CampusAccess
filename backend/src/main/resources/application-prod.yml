# ============================================================
# application-prod.yml — Production profile
# Fail-fast: any missing required env var crashes startup.
# No debug logging. CORS restricted. ddl-auto=none.
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useSSL=true&serverTimezone=UTC&requireSSL=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none             # NEVER let Hibernate touch schema in prod
    show-sql: false

  flyway:
    enabled: true
    out-of-order: false

logging:
  level:
    root: WARN
    com.pict.gatesecurity: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","logger":"%logger{36}","message":"%msg"}%n'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never        # Don't leak DB info through actuator in prod

springdoc:
  swagger-ui:
    enabled: false               # Disable Swagger UI in production
  api-docs:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}   # Must be set — no wildcard
