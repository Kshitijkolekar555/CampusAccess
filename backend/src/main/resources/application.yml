# ============================================================
# application.yml — Base configuration (all profiles inherit this)
# Sensitive values default to local dev defaults if env vars are unset.
# ============================================================

spring:
  application:
    name: pict-gate-security

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # --- Database (Default to local MySQL) ---
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:acampusaccessdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # --- JPA ---
  jpa:
    open-in-view: false          # Avoid lazy-loading across HTTP boundary
    hibernate:
      ddl-auto: none             # Flyway owns the schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
          fetch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16
    show-sql: false

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: false
    out-of-order: false

  # --- Mail (Gmail SMTP) ---
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:testpass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
  default-produces-media-type: application/json

# --- App-level config ---
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-at-least-256-bits-long-pad-if-needed} # 256-bit minimum
    access-token-expiry-ms: 900000              # 15 minutes
    refresh-token-expiry-ms: 604800000          # 7 days
  visitor:
    overstay-threshold-hours: 4                 # Flag visitors inside > 4 hrs
    overstay-check-interval-cron: "0 */15 * * * *"  # Every 15 minutes
  canteen:
    late-checkin-cutoff: "09:30"               # Mark LATE if after this time
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  notification:
    max-retries: 3
    retry-interval-cron: "0 */15 * * * *"
  cache:
    type: caffeine                        # Switch to 'redis' for production
    ttl-seconds: 30                       # Default TTL for dashboard cache
    caffeine-spec: maximumSize=200,expireAfterWrite=30s

  # --- Redis (only used when app.cache.type=redis) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
