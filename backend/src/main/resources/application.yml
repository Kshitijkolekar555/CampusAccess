# ============================================================
# application.yml — Base configuration (all profiles inherit this)
# Sensitive values MUST come from environment variables.
# Never set real secrets here.
# ============================================================

spring:
  application:
    name: pict-gate-security

  # --- JPA ---
  jpa:
    open-in-view: false          # Avoid lazy-loading across HTTP boundary
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false

  # --- Mail (Gmail SMTP) ---
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
  default-produces-media-type: application/json

# --- App-level config ---
app:
  jwt:
    secret: ${JWT_SECRET}                       # 256-bit minimum, set in env
    access-token-expiry-ms: 900000              # 15 minutes
    refresh-token-expiry-ms: 604800000          # 7 days
  visitor:
    overstay-threshold-hours: 4                 # Flag visitors inside > 4 hrs
    overstay-check-interval-cron: "0 */15 * * * *"  # Every 15 minutes
  canteen:
    late-checkin-cutoff: "09:30"               # Mark LATE if after this time
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    max-retries: 3
    retry-interval-cron: "0 */15 * * * *"
