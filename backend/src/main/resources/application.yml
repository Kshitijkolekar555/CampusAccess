# ============================================================
# application.yml — Base configuration (all profiles inherit this)
# Sensitive values default to local dev defaults if env vars are unset.
# ============================================================

spring:
  application:
    name: pict-gate-security

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # --- Database (Default to local MySQL) ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acampusaccessdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      leak-detection-threshold: 20000

  # --- JPA ---
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 25
          fetch_size: 25
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 16
    show-sql: false

  # --- Flyway ---
  flyway:
    enabled: false
    baseline-on-migrate: true
    validate-on-migrate: false

  # --- Mail (Gmail SMTP) ---
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:testpass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # --- Redis (Used only when app.cache.type=redis) ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

# --- Server ---
server:
  port: 8081

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: false
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99

# --- OpenAPI / Swagger ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
  default-produces-media-type: application/json

# --- Application Configuration ---
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-key-at-least-256-bits-long-pad-if-needed}
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000

  visitor:
    overstay-threshold-hours: 4
    overstay-check-interval-cron: "0 */15 * * * *"

  canteen:
    late-checkin-cutoff: "09:30"

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3004,http://localhost:5173,http://localhost:3002,http://localhost:3003}

  notification:
    max-retries: 3
    retry-interval-cron: "0 */15 * * * *"

  cache:
    type: caffeine
    ttl-seconds: 30
    caffeine-spec: maximumSize=200,expireAfterWrite=30s

face:
  service:
    url: ${FACE_SERVICE_URL:http://localhost:8001}