# ============================================================
# application-h2.yml — Local H2 In-Memory Profile
# Run with: -Dspring.profiles.active=h2
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:acampusaccessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

logging:
  level:
    root: INFO
    com.pict.gatesecurity: DEBUG

app:
  jwt:
    secret: local-dev-secret-key-at-least-256-bits-long-pad-if-needed
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3004,http://localhost:5173,http://localhost:8081,http://localhost:3002,http://localhost:3003

face:
  service:
    url: ${FACE_SERVICE_URL:http://localhost:8001}
