# ============================================================
# docker-compose.yml — Local Development
# Services: MySQL + Spring Boot Backend
# Frontend (Phase 8) will be added here.
#
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. docker-compose up --build
# ============================================================

services:
  # ----------------------------------------------------------
  # MySQL 8
  # ----------------------------------------------------------
  mysql:
    image: mysql:8
    container_name: pict_gatesecurity_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-${DB_PASSWORD}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acampusaccessdb}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gatesecurity_net

  # ----------------------------------------------------------
  # Spring Boot Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pict_gatesecurity_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-acampusaccessdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-${MYSQL_USER:-root}}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD}}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-acampusaccessdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-${MYSQL_USER:-root}}
      DB_PASSWORD: ${DB_PASSWORD:-${MYSQL_PASSWORD}}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-acampusaccessdb}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gatesecurity_net

# ----------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------
volumes:
  mysql_data:
    driver: local

networks:
  gatesecurity_net:
    driver: bridge
