# ============================================================
# docker-compose.yml — Local Development
# Services: MySQL + Spring Boot Backend + Frontend
# ============================================================

services:
  # ----------------------------------------------------------
  # MySQL 8.4
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: pict_gatesecurity_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-acampusaccessdb}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Purva@2118_}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Purva@2118_}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - gatesecurity_net

  # ----------------------------------------------------------
  # Spring Boot Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pict_gatesecurity_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      faceservice:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-acampusaccessdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-Purva@2118_}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      FACE_SERVICE_URL: http://faceservice:8001
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - gatesecurity_net

  # ----------------------------------------------------------
  # Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pict_gatesecurity_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - gatesecurity_net

  # ----------------------------------------------------------
  # Face Service
  # ----------------------------------------------------------
  faceservice:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    container_name: pict_gatesecurity_faceservice
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - gatesecurity_net

# ----------------------------------------------------------
# Volumes & Networks
# ----------------------------------------------------------
volumes:
  mysql_data:
    driver: local

networks:
  gatesecurity_net:
    driver: bridge
